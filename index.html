<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyPay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding-top:30px}
.card{background:white; width:90%; max-width:350px; padding:25px; border-radius:15px; text-align:center}
input{width:90%; padding:13px; margin:10px 0; border-radius:8px; border:1px solid #ccc}
button{width:95%; padding:13px; background:#00b875; color:white; border:none; border-radius:8px; font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#00b875">MyPay</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<button onclick="register()">Create Account</button>
<p id="msg"></p>
</div>
<script>
const SUPABASE_URL = "https://ggpiiugpasqgevkmzlbk.supabase.co";
const SUPABASE_KEY = "sb_publishable_qentP86sH2Hk3T-VopoLZw_972a0MRg";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function register(){
  const name=document.getElementById('name').value;
  const phone=document.getElementById('phone').value;
  const msg=document.getElementById('msg');
  if(!name||!phone){alert("Cika suna da phone"); return;}
  msg.innerText="Ana kokari...";
  const {error}=await supabaseClient.from('users').insert([{name,phone,balance:0}]);
  if(error){msg.innerText="Error: "+error.message; msg.style.color="red";}
  else{msg.innerText="Success! "+name+" an bude maka!"; msg.style.color="green";}
}
</script>
</body>
</html>
